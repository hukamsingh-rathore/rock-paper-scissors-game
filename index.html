<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-contanior">
        <h1>Rock Paper Scissors</h1>
        <div class="choices">
            <div class="choice" id="rock">
                <img src="Rock.png">
            </div>
            <div class="choice" id="paper">
                <img src="paper.png">
            </div>
            <div class="choice" id="sicssor">
                <img src="sicssor.png">
            </div>
        </div>
        <div class="score-bord">
            <div class="score">
                <p id="user-score">0</p>
                <p>You Score</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>Computer Score</p>
            </div>
        </div>
        <div class="massage-container">
            <p id="msg">Play your move!</p>
        </div>
        <button id="reset-btn">Reset Game</button>
    </div>
    <script src="app.js"></script>
    
</body>
</html>
